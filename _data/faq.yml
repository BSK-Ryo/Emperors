# Emperor's Basketball Team - FAQ Source of Truth
# このYAMLファイルがFAQの単一ソースです。
#   - Jekyllビルド時に faq.html / index.html へ静的レンダリングされる（SEO/LLMO向け）
#   - 同じ内容が FAQPage JSON-LD として faq.html に出力される
#   - 実運用では admin.html (CMS) で登録した Firestore のデータがクライアント側で上書きする
#   - CMSデータが無い／失敗した場合はこの静的データがそのまま表示される
#
# カテゴリ: 体験参加 / 練習 / チーム / 費用
# order: 表示順（小さいほど上）

- category: 体験参加
  order: 0
  question: 初心者でも大丈夫ですか？
  answer: 練習は試合形式がメインのため、ある程度のバスケ経験がある方を対象としています。ただし、ブランクがある方は大歓迎です！まずは気軽にご連絡ください！

- category: 体験参加
  order: 1
  question: 見学だけでもOKですか？
  answer: もちろんOKです！事前にお問い合わせフォームまたはLINE・Instagramからご連絡いただければ、練習日時と場所をお伝えいたします。

- category: 練習
  order: 2
  question: 必要な道具はありますか？
  answer: バスケットシューズ（室内用）、ウェア、ボールをご持参ください。タオルや飲み物と参加費(200〜300円)もお忘れなく。※試合時に使うビブスはこちらでご用意いたします。

- category: 練習
  order: 3
  question: 練習場所はどこですか？
  answer: 札幌市東区・北区の小中学校体育館を中心に活動しています。詳細な会場はお問い合わせ時にお伝えしています。

- category: チーム
  order: 4
  question: 年齢制限はありますか？
  answer: 18歳以上の方が対象です。上限はありません。幅広い年齢層のメンバーが在籍しています。現在は10代数名と20代〜30代が同じくらいの割合で在籍しています。

- category: チーム
  order: 5
  question: 掛け持ちは可能ですか？
  answer: 原則として他チームとの掛け持ちは不可とさせていただいています。Emperor'sに所属して一緒にバスケを楽しんでいただける方を募集しています。

- category: 費用
  order: 6
  question: 参加費はいくらですか？
  answer: 1回あたり200〜300円です。冬季は暖房使用の有無によって金額が変動する場合があります。
